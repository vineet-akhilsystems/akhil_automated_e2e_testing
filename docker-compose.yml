services:
  portal:
    build: .
    image: augastam-test-studio:latest
    container_name: augastam-test-studio
    env_file: .env
    environment:
      PORTAL_HOST: 0.0.0.0
      PORTAL_PORT: "4173"
      PORTAL_DATA_DIR: /data/.portal
    ports:
      # Bound to loopback; put a TLS reverse proxy (see docs/DEPLOYMENT.md) in front.
      - "127.0.0.1:${PORTAL_PORT_PUBLISHED:-4173}:4173"
    volumes:
      - portal_data:/data
      - auth_data:/app/.auth
    shm_size: "1gb"          # Chromium crashes with the default 64 MB /dev/shm
    init: true
    restart: unless-stopped
    stop_grace_period: 30s   # lets the portal mark active runs interrupted cleanly

volumes:
  portal_data:
  auth_data:
