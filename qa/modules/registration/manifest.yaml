module: registration
route: /registration
existing_record_route: /registration/1101f999-7c91-4ba5-a52b-a80d728c588e/<uhr_id>
base_url_env: BASE_URL
tenant: Miracle HIS Demo          # tenant_id f8eadaa5-9e1f-4998-821f-f63f5cb33639
facility: Akhil Demo2 Delhi       # facility_id f0fc2bd7-866d-4c4c-b4cf-e7506c369574
roles: [Admin]
registration_types:
  - New Registration
  - New Born Registration
  - International Registration
  - Outside Registration
  - Staff Registration
  - Diagnostic Registration
cases: cases/registration-cases.json      # Excel export: cases/registration-cases.xlsx
rules: rules.md
discovery: discovery/                       # generated by `npm run reg:discover`
results: results/                           # generated by `npm run reg:cases`
test_data:
  naming: "Agent Testing User<Words>"       # first=Agent, middle=Testing, last=UserThree (digits are stripped); counter in data/agent-seq.json
  phones: unique 10-digit mobiles starting with 9, generated per case
  id_proof: data/agent-test-id-proof.pdf    # synthetic, `node qa/tools/make-test-pdf.js`
  cleanup: none (no delete endpoint; records can only be marked inactive)
backend:
  create: POST patient-service/patient-registration/autogenerate
  update: PUT patient-service/patient-registration/update-details
  details: GET patient-service/patient-registration/details/{tenant}
  search: POST patient-service/patient-registration/get-all-patient-details/{tenant}
  pincode: GET configuration-service/reference-lookup/pincode-lookup/{tenant}
  mongo_collections: [PATIENT_REGISTRATION_DB, PATIENT_REGISTRATION_PRE_DB, PATIENT_ATTACHMENTS_DB, REFERENCE_LOOKUP, WEBPART, WORKFLOW, TRAIL_TABLE]
